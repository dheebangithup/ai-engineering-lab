corpus:

  # ============================================================
  # PAYMENT API
  # ============================================================

  - memory_id: runbook-payment-api-timeout
    memory_type: runbook
    title: Payment API Timeout Recovery
    content: >
      When the payment API starts timing out, first check application
      error rates and request latency. Verify database connection pool
      utilization and database latency. If the connection pool is
      exhausted, identify long-running or leaked connections. After
      correcting the issue, verify payment API latency and error rate
      before restoring normal traffic.
    tags:
      - payment
      - api
      - timeout
      - recovery

  - memory_id: lesson-payment-connection-pool-exhaustion
    memory_type: lesson
    title: Payment API Connection Pool Exhaustion
    content: >
      Payment API timeouts were caused by database connection pool
      exhaustion. The application created long-lived connections that
      were not released correctly. Monitoring active connections and
      pool utilization helped identify the issue.
    tags:
      - payment
      - database
      - connection-pool
      - timeout

  - memory_id: lesson-payment-db-latency
    memory_type: lesson
    title: Payment API Database Latency
    content: >
      Elevated database latency can cause payment API requests to
      exceed their timeout threshold. Database query latency should
      be checked before increasing application request timeouts.
    tags:
      - payment
      - database
      - latency

  - memory_id: lesson-payment-pool-increase-not-fix
    memory_type: lesson
    title: Increasing Payment Connection Pool Size Was Not the Fix
    content: >
      Increasing the database connection pool size temporarily reduced
      connection errors but did not resolve the underlying connection
      leak. The leak had to be fixed before increasing pool capacity.
    tags:
      - payment
      - database
      - connection-pool
      - leak

  # ============================================================
  # DATABASE
  # ============================================================

  - memory_id: runbook-database-connection-exhaustion
    memory_type: runbook
    title: Database Connection Exhaustion Recovery
    content: >
      When database connections are exhausted, check active connections,
      pool utilization, connection wait time, and application connection
      leaks. Identify long-running connections and verify that connections
      are released correctly. After remediation, monitor pool utilization
      and connection wait time.
    tags:
      - database
      - connection-pool
      - exhaustion
      - recovery

  - memory_id: lesson-db-connection-leak
    memory_type: lesson
    title: Database Connection Leak
    content: >
      A database connection leak can gradually exhaust the application
      connection pool. The leak was caused by connections not being
      closed after request processing. Connection lifecycle monitoring
      helped identify the problem.
    tags:
      - database
      - connection-leak
      - connection-pool

  - memory_id: lesson-db-pool-monitoring
    memory_type: lesson
    title: Database Pool Monitoring
    content: >
      Monitoring active connections, idle connections, pool utilization,
      and connection wait time provides early warning of database pool
      exhaustion.
    tags:
      - database
      - monitoring
      - connection-pool

  - memory_id: lesson-db-pool-size-delays-problem
    memory_type: lesson
    title: Increasing Database Pool Size Can Delay Failure
    content: >
      Increasing the database connection pool size can delay connection
      exhaustion but does not fix an underlying connection leak. Pool
      capacity changes should be combined with connection lifecycle
      investigation.
    tags:
      - database
      - connection-pool
      - leak

  # ============================================================
  # PRODUCTION DEPLOYMENT
  # ============================================================

  - memory_id: runbook-production-deployment-rollback
    memory_type: runbook
    title: Production Deployment Rollback
    content: >
      When a production deployment causes elevated errors, first verify
      application error rate and health checks. If the deployment is
      responsible, initiate rollback to the previous stable version.
      After rollback, verify application health, error rate, latency,
      and database compatibility before declaring recovery complete.
    tags:
      - deployment
      - production
      - rollback
      - recovery

  - memory_id: lesson-rollback-error-rate
    memory_type: lesson
    title: Rollback After Production Error Rate Increase
    content: >
      A production deployment caused a significant increase in HTTP 5xx
      errors. Rolling back to the previous stable version restored the
      application error rate. Error-rate monitoring was the primary
      signal used to validate recovery.
    tags:
      - deployment
      - rollback
      - error-rate

  - memory_id: lesson-db-migration-backward-compatibility
    memory_type: lesson
    title: Database Migration Backward Compatibility
    content: >
      Production deployments can fail during rollback when database
      migrations are not backward compatible. Database schema changes
      should support the previous application version when rollback
      capability is required.
    tags:
      - deployment
      - database
      - migration
      - rollback

  - memory_id: lesson-health-check-after-rollback
    memory_type: lesson
    title: Health Checks After Deployment Rollback
    content: >
      A successful rollback should be followed by application health
      checks, error-rate validation, latency checks, and verification
      that critical endpoints are functioning correctly.
    tags:
      - deployment
      - rollback
      - health-check


