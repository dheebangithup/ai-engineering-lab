version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: strata-postgres
    environment:
      POSTGRES_DB: strata
      POSTGRES_USER: strata_user
      POSTGRES_PASSWORD: strata_password
    ports:
      - "5432:5432"
    volumes:
      - strata_pgdata:/var/lib/postgresql/data
      - ./sql/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql
    restart: unless-stopped

volumes:
  strata_pgdata:
